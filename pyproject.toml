[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "fa26-telemetry-engineer"
version = "0.1.1"
description = "Analisador determinístico de telemetria e energia para Assetto Corsa."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.39,<2",
]

[tool.setuptools.packages.find]
include = ["telemetry*"]
